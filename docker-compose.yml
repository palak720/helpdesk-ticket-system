services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  server:
    build: ./server
    ports: ["5000:5000"]
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/helpdesk
      JWT_SECRET: change-me-in-real-deployments
      CLIENT_URL: http://localhost:5173
    depends_on: [mongo]
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    ports: ["5173:80"]
    depends_on: [server]
volumes:
  mongo-data:
